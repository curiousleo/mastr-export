appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#FFB800"
        - "#2563EB"
        - "#16A34A"
        - "#06B6D4"
        - "#D97706"
        - "#6B7280"
        - "#DC2626"
        - "#7C3AED"
      dark:
        - "#FFB800"
        - "#2563EB"
        - "#16A34A"
        - "#06B6D4"
        - "#D97706"
        - "#6B7280"
        - "#DC2626"
        - "#7C3AED"
  colorScales:
    default:
      light:
        - "#ADD8E6"
        - "#00008B"
      dark:
        - "#ADD8E6"
        - "#00008B"
  colors:
    primary:
      light: "#2563eb"
      dark: "#3b82f6"
    accent:
      light: "#c2410c"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    evidence-connector-clickhouse: {}
