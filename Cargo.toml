[package]
name = "mastr-export"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
argh = "0.1.13"
arrow = { version = "57.0.0", default-features = false }
arrow-cast = "57.0.0"
parquet = { version = "57.0.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
quick-xml = { version = "0.36.0", default-features = false }
